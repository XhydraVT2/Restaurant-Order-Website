<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TableTap – QR table ordering</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Fraunces:wght@600&family=Zen+Maru+Gothic:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1b1c1f;--mut:#666a72;--ln:#e3e1dc;--ac:#1b1c1f;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141517;--card:#1e2023;--tx:#f1f1ef;--mut:#9a9da5;--ln:#2e3035}}
:root[data-theme="dark"]{--bg:#141517;--card:#1e2023;--tx:#f1f1ef;--mut:#9a9da5;--ln:#2e3035}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;gap:6px;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--card)}
.logo{font:700 17px 'Bricolage Grotesque',Inter,sans-serif}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px}
.seg .on{background:var(--tx);color:var(--bg)}
.w{max-width:480px;margin:0 auto;padding-bottom:90px;font-family:var(--f,Inter),Inter,sans-serif}
.k{max-width:1100px;margin:0 auto;padding:16px 14px}
.hero{padding:22px 16px 14px}
.hero h1{font:700 26px/1.15 'Bricolage Grotesque',Inter,sans-serif;margin:0 0 6px}
.mut{color:var(--mut)}
.rc{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:0 14px 12px;overflow:hidden}
.rh{padding:14px;background:var(--ac);color:var(--ai);font-family:var(--f)}
.rh b{font-size:20px}
.tb{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.tb button{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:6px 10px}
.qr{display:grid;grid-template-columns:repeat(5,5px);gap:1px}.qr i{width:5px;height:5px;background:var(--tx)}.qr i.o{background:transparent}
.bar{background:var(--ac);color:var(--ai);padding:14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f)}
.bar b{font-size:20px}
.bar button{border:1px solid currentColor;background:none;border-radius:8px;padding:4px 10px;color:inherit}
.tabs{display:flex;border-bottom:1px solid var(--ln);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;border-bottom:3px solid transparent;color:var(--mut)}
.tabs .on{color:var(--tx);border-color:var(--ac);font-weight:600}
.pills{display:flex;gap:8px;padding:12px 14px;overflow-x:auto}
.pills button{white-space:nowrap;border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:6px 14px}
.pills .on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.it{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln);background:var(--card);width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.em{flex:none;width:68px;height:68px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:34px}
.it h3{margin:0;font-size:16px}.it p{margin:2px 0 4px;color:var(--mut);font-size:13px}
.cb{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.cb button,.btn{width:100%;border:0;background:var(--ac);color:var(--ai);border-radius:12px;padding:14px;font-weight:600;display:flex;justify-content:space-between;max-width:452px;margin:0 auto}
.btn{justify-content:center;max-width:none;margin-top:12px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln);width:auto;padding:8px 12px;margin:0}
.sec{padding:14px}.sec h2{font-size:15px;margin:0 0 8px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.st{display:flex;align-items:center;gap:6px}.st button{width:28px;height:28px;border-radius:8px;border:1px solid var(--ln);background:var(--card)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-weight:700;font-size:17px;padding-top:8px}
.pay{display:flex;gap:8px;flex-wrap:wrap}.pay button{flex:1;min-width:110px;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:10px}
.pay .on{border:2px solid var(--ac);font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;font-family:var(--f),Inter,sans-serif}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.ch button{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:7px 12px}
.ch .on{border:2px solid var(--ac);font-weight:600}
.prog{display:flex;gap:4px;margin:12px 0 6px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--ln)}.prog i.on{background:var(--ac)}
.oc{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.col h2{font-size:14px;margin:0 0 8px;color:var(--mut)}
.tk{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:10px}
.tk ul{margin:6px 0;padding-left:18px}
.tk .btn{margin-top:8px;padding:9px}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
</style>
</head>
<body>
<div class="top"><span class="logo">TableTap</span><div class="seg" id="seg"></div></div>
<div id="app"></div>
<script>
var R=[
{id:'esq',name:'La Esquina',tag:'Street tacos & bowls',ac:'#d8431f',ai:'#fff',f:"'Bricolage Grotesque'",cats:['Tacos','Bowls','Drinks'],items:[
{id:'e1',c:0,n:'Al pastor taco',d:'Pork, pineapple, onion, cilantro.',p:3.5,e:'🌮',o:[{k:'Tortilla',c:[['Corn',0],['Flour',0]]},{k:'Heat',c:[['Mild',0],['Hot',0]]}]},
{id:'e2',c:0,n:'Baja fish taco',d:'Crispy fish, cabbage, lime crema.',p:4.25,e:'🐟',o:[{k:'Tortilla',c:[['Corn',0],['Flour',0]]}]},
{id:'e3',c:0,n:'Mushroom taco',d:'Roasted mushrooms, salsa verde.',p:3.25,e:'🍄',o:[{k:'Tortilla',c:[['Corn',0],['Flour',0]]}]},
{id:'e4',c:1,n:'Burrito bowl',d:'Rice, beans, corn salsa, guacamole.',p:9.5,e:'🥗',o:[{k:'Protein',c:[['Chicken',0],['Beef',1],['Tofu',0]]},{k:'Add',c:[['None',0],['Extra guac',1.5]]}]},
{id:'e5',c:2,n:'Hibiscus agua fresca',d:'Cold, lightly sweet, no ice melt.',p:3,e:'🌺',o:[{k:'Size',c:[['Regular',0],['Large',1]]}]},
{id:'e6',c:2,n:'Horchata',d:'Rice, cinnamon, vanilla.',p:3.25,e:'🥛',o:[{k:'Size',c:[['Regular',0],['Large',1]]}]}]},
{id:'nam',name:'Nami Ramen',tag:'Noodles, small plates',ac:'#2f3f9e',ai:'#fff',f:"'Zen Maru Gothic'",cats:['Ramen','Sides','Drinks'],items:[
{id:'n1',c:0,n:'Tonkotsu ramen',d:'Pork broth, chashu, egg, scallion.',p:12.5,e:'🍜',o:[{k:'Noodles',c:[['Regular',0],['Firm',0]]},{k:'Extra',c:[['None',0],['Extra egg',1.5],['Extra chashu',3]]}]},
{id:'n2',c:0,n:'Miso veggie ramen',d:'Miso broth, corn, bok choy, tofu.',p:11,e:'🥬',o:[{k:'Noodles',c:[['Regular',0],['Firm',0]]}]},
{id:'n3',c:1,n:'Gyoza (6)',d:'Pan-fried pork dumplings.',p:6,e:'🥟',o:[]},
{id:'n4',c:1,n:'Edamame',d:'Sea salt.',p:4,e:'🫛',o:[]},
{id:'n5',c:2,n:'Iced barley tea',d:'Roasted, unsweetened.',p:2.5,e:'🍵',o:[]},
{id:'n6',c:2,n:'Ramune soda',d:'Original marble bottle.',p:3.5,e:'🫧',o:[]}]},
{id:'mar',name:'Marlowe & Daughters',tag:'Bakery café',ac:'#b8325f',ai:'#fff',f:"'Fraunces'",cats:['Bakes','Coffee'],items:[
{id:'m1',c:0,n:'Butter croissant',d:'Laminated 3 days, baked at dawn.',p:3.75,e:'🥐',o:[{k:'Warm',c:[['Yes',0],['No',0]]}]},
{id:'m2',c:0,n:'Guava pastelito',d:'Flaky pastry, guava and cream cheese.',p:3.25,e:'🥧',o:[]},
{id:'m3',c:0,n:'Sourdough toast',d:'Whipped ricotta, honey, sea salt.',p:6.5,e:'🍞',o:[{k:'Add',c:[['None',0],['Fried egg',2]]}]},
{id:'m4',c:1,n:'Flat white',d:'Double ristretto, steamed milk.',p:4,e:'☕',o:[{k:'Milk',c:[['Whole',0],['Oat',0.6],['Almond',0.6]]}]},
{id:'m5',c:1,n:'Iced latte',d:'Espresso over cold milk.',p:4.5,e:'🧋',o:[{k:'Milk',c:[['Whole',0],['Oat',0.6],['Almond',0.6]]}]}]}
];
var ST=['Received','Preparing','Ready','Served'];
var MSG=['Sent to the kitchen','Being prepared','On its way to your table','Served. Enjoy your meal'];
var S={m:'c',rid:null,t:null,cat:0,cart:[],v:'menu',mod:null,sel:[],q:1,pay:'Card',orders:[],seq:41,kid:'esq'};
var $=function(i){return document.getElementById(i)};
var $$=function(n){return '$'+n.toFixed(2)};
var rest=function(id){return R.filter(function(r){return r.id===id})[0]};
function brand(r){var a=$('app');a.style.setProperty('--ac',r?r.ac:'#1b1c1f');a.style.setProperty('--ai',r?r.ai:'#fff');a.style.setProperty('--f',r?r.f:'Inter')}
function qr(s){var h='',x=s*9301+49297;for(var i=0;i<25;i++){x=(x*1103515245+12345)&0x7fffffff;h+='<i class="'+((x>>8)%2?'':'o')+'"></i>'}return '<span class="qr">'+h+'</span>'}
function setM(m){S.m=m;render()}
function scan(r,t){S.rid=r;S.t=t;S.cat=0;S.cart=[];S.v='menu';render()}
function leave(){S.rid=null;S.cart=[];render()}
function go(v){S.v=v;render();scrollTo(0,0)}
function openItem(id){var r=rest(S.rid),it=r.items.filter(function(i){return i.id===id})[0];S.mod=it;S.sel=it.o.map(function(){return 0});S.q=1;render()}
function pick(g,i){S.sel[g]=i;render()}
function qty(d){S.q=Math.max(1,S.q+d);render()}
function unit(it,sel){return it.p+it.o.reduce(function(a,o,g){return a+o.c[sel[g]][1]},0)}
function add(){var it=S.mod,lab=it.o.map(function(o,g){return o.c[S.sel[g]][0]}).join(', ');
var ex=S.cart.filter(function(l){return l.it.id===it.id&&l.lab===lab})[0];
if(ex)ex.q+=S.q;else S.cart.push({it:it,lab:lab,u:unit(it,S.sel),q:S.q});S.mod=null;render()}
function cq(i,d){S.cart[i].q+=d;if(S.cart[i].q<1)S.cart.splice(i,1);if(!S.cart.length)S.v='menu';render()}
function sub(){return S.cart.reduce(function(a,l){return a+l.u*l.q},0)}
function cnt(){return S.cart.reduce(function(a,l){return a+l.q},0)}
function setPay(p){S.pay=p;render()}
function place(){var s=sub();S.orders.push({id:S.seq++,rid:S.rid,t:S.t,lines:S.cart.map(function(l){return{n:l.it.n,lab:l.lab,q:l.q}}),total:s*1.07,pay:S.pay,st:0,at:new Date()});S.cart=[];S.v='track';render();scrollTo(0,0)}
function adv(id){S.orders.forEach(function(o){if(o.id===id&&o.st<3)o.st++});render()}
function setK(id){S.kid=id;render()}
function render(){
$('seg').innerHTML=['c','k'].map(function(m){return '<button class="'+(S.m===m?'on':'')+'" onclick="setM(\''+m+'\')">'+(m==='c'?'Guest phone':'Kitchen')+'</button>'}).join('');
if(S.m==='k'){brand(rest(S.kid));$('app').innerHTML=kitchen();return}
var r=S.rid?rest(S.rid):null;brand(r);
$('app').innerHTML=r?guest(r):home();
}
function home(){
return '<div class="w"><div class="hero"><h1>Scan your table’s code to order</h1><p class="mut" style="margin:0">Each table has its own QR code. Tap one below to try it as a guest.</p></div>'+
R.map(function(r,ri){return '<div class="rc"><div class="rh" style="--ac:'+r.ac+';--f:'+r.f+'"><b>'+r.name+'</b><div style="opacity:.85;font-size:13px">'+r.tag+'</div></div><div class="tb">'+
[1,2,3,4].map(function(t){return '<button onclick="scan(\''+r.id+'\','+t+')">'+qr(ri*10+t)+'Table '+t+'</button>'}).join('')+'</div></div>'}).join('')+'</div>'}
function guest(r){
var h='<div class="w"><div class="bar"><div><b>'+r.name+'</b><div style="font-size:13px;opacity:.9">Table '+S.t+'</div></div><button onclick="leave()">Leave table</button></div>'+
'<div class="tabs">'+[['menu','Menu'],['cart','Cart'+(cnt()?' ('+cnt()+')':'')],['track','My orders']].map(function(t){return '<button class="'+(S.v===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</div>';
if(S.v==='menu'){
h+='<div class="pills">'+r.cats.map(function(c,i){return '<button class="'+(S.cat===i?'on':'')+'" onclick="S.cat='+i+';render()">'+c+'</button>'}).join('')+'</div>';
h+=r.items.filter(function(i){return i.c===S.cat}).map(function(i){return '<button class="it" onclick="openItem(\''+i.id+'\')"><span class="em">'+i.e+'</span><span style="flex:1"><h3>'+i.n+'</h3><p>'+i.d+'</p><b>'+$$(i.p)+'</b></span></button>'}).join('');
if(cnt())h+='<div class="cb"><button onclick="go(\'cart\')"><span>View cart ('+cnt()+')</span><span>'+$$(sub())+'</span></button></div>'}
if(S.v==='cart'){
if(!S.cart.length)h+='<div class="sec mut">Your cart is empty. Pick something from the menu.</div><div class="sec"><button class="btn" onclick="go(\'menu\')">Browse menu</button></div>';
else{h+='<div class="sec">'+S.cart.map(function(l,i){return '<div class="ln"><div><b>'+l.it.n+'</b><div class="mut" style="font-size:13px">'+l.lab+'</div></div><div style="text-align:right"><div class="st"><button onclick="cq('+i+',-1)" aria-label="Remove one">−</button>'+l.q+'<button onclick="cq('+i+',1)" aria-label="Add one">+</button></div><div>'+$$(l.u*l.q)+'</div></div></div>'}).join('')+'</div>';
var s=sub();h+='<div class="sec tot"><div><span class="mut">Subtotal</span><span>'+$$(s)+'</span></div><div><span class="mut">Tax (7%)</span><span>'+$$(s*.07)+'</span></div><div class="g"><span>Total</span><span>'+$$(s*1.07)+'</span></div></div>';
h+='<div class="sec"><h2>Pay with</h2><div class="pay">'+['Card','Phone wallet','Cash at table'].map(function(p){return '<button class="'+(S.pay===p?'on':'')+'" onclick="setPay(\''+p+'\')">'+p+'</button>'}).join('')+'</div><button class="btn" onclick="place()">Place order for Table '+S.t+'</button></div>'}}
if(S.v==='track'){
var os=S.orders.filter(function(o){return o.rid===r.id&&o.t===S.t}).reverse();
if(!os.length)h+='<div class="sec mut">No orders yet. Once you place one, you’ll see its progress here.</div>';
h+='<div class="sec">'+os.map(function(o){return '<div class="oc"><div style="display:flex;justify-content:space-between"><b>Order #'+o.id+'</b><span>'+$$(o.total)+'</span></div><div class="prog">'+ST.map(function(_,i){return '<i class="'+(i<=o.st?'on':'')+'"></i>'}).join('')+'</div><div><b>'+ST[o.st]+'</b> <span class="mut">· '+MSG[o.st]+'</span></div><div class="mut" style="font-size:13px;margin-top:8px">'+o.lines.map(function(l){return l.q+'× '+l.n}).join(', ')+'</div></div>'}).join('')+
(os.length?'<p class="mut" style="font-size:13px">Demo: switch to Kitchen above and advance this order to see it update here.</p>':'')+'</div>'}
if(S.mod){var it=S.mod;h+='<div class="mo" onclick="if(event.target===this){S.mod=null;render()}"><div class="sh"><div style="display:flex;gap:12px;align-items:center"><span class="em">'+it.e+'</span><div><h3 style="margin:0;font-size:18px">'+it.n+'</h3><div class="mut" style="font-size:13px">'+it.d+'</div></div></div><div style="margin-top:14px">'+
it.o.map(function(o,g){return '<b>'+o.k+'</b><div class="ch">'+o.c.map(function(c,i){return '<button class="'+(S.sel[g]===i?'on':'')+'" onclick="pick('+g+','+i+')">'+c[0]+(c[1]?' +'+$$(c[1]):'')+'</button>'}).join('')+'</div>'}).join('')+
'<div style="display:flex;justify-content:space-between;align-items:center"><div class="st"><button onclick="qty(-1)" aria-label="Fewer">−</button>'+S.q+'<button onclick="qty(1)" aria-label="More">+</button></div><span class="mut">'+$$(unit(it,S.sel))+' each</span></div><button class="btn" onclick="add()">Add to cart · '+$$(unit(it,S.sel)*S.q)+'</button></div></div></div>'}
return h+'</div>'}
function kitchen(){
var r=rest(S.kid),os=S.orders.filter(function(o){return o.rid===S.kid});
var h='<div class="k"><div class="pills" style="padding:0 0 12px">'+R.map(function(x){return '<button class="'+(x.id===S.kid?'on':'')+'" onclick="setK(\''+x.id+'\')">'+x.name+'</button>'}).join('')+'</div>'+
'<h1 style="font:700 22px var(--f),Inter,sans-serif;margin:0">'+r.name+' · live orders</h1><div class="mut">New orders appear here the moment a guest taps Place order.</div>';
if(!os.length)h+='<div class="oc" style="margin-top:14px">No orders yet. Switch to Guest phone, scan a table and place one.</div>';
h+='<div class="cols">'+[0,1,2].map(function(s){var l=os.filter(function(o){return o.st===s});
return '<div class="col"><h2>'+['New','Preparing','Ready to serve'][s]+' ('+l.length+')</h2>'+l.map(function(o){return '<div class="tk"><div style="display:flex;justify-content:space-between"><b>#'+o.id+' · Table '+o.t+'</b><span class="mut">'+o.at.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</span></div><ul>'+o.lines.map(function(x){return '<li><b>'+x.q+'×</b> '+x.n+(x.lab?'<div class="mut" style="font-size:12px">'+x.lab+'</div>':'')+'</li>'}).join('')+'</ul><div class="mut" style="font-size:12px">Paid via: '+o.pay+'</div><button class="btn" onclick="adv('+o.id+')">'+['Start preparing','Mark ready','Mark served at table'][s]+'</button></div>'}).join('')+'</div>'}).join('')+'</div>';
var d=os.filter(function(o){return o.st===3}).length;if(d)h+='<p class="mut">'+d+' order'+(d>1?'s':'')+' served today.</p>';
return h+'</div>'}
render();
</script>
</body>
</html>
