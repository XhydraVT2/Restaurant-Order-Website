<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#f2f3f6;--card:#fff;--tx:#14151a;--mut:#6a6e78;--ln:#e6e8ee;--sh:0 2px 14px rgba(20,21,26,.07);--ac:#14151a;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--card:#191b20;--tx:#f2f2f0;--mut:#9a9ea8;--ln:#2a2d34;--sh:0 2px 14px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e0f12;--card:#191b20;--tx:#f2f2f0;--mut:#9a9ea8;--ln:#2a2d34;--sh:0 2px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--ln)}
.top[hidden]{display:none}
.logo{font:800 18px 'Bricolage Grotesque',Inter,sans-serif}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13px}
.seg .on{background:var(--tx);color:var(--bg)}
.w{max-width:480px;margin:0 auto;padding-bottom:110px;font-family:var(--f,Inter),Inter,sans-serif}
.k{max-width:1100px;margin:0 auto;padding:18px 14px}
.h1{font:800 24px/1.15 'Bricolage Grotesque',Inter,sans-serif;margin:0 0 6px}
.mut{color:var(--mut)}
.hero{background:var(--ac);color:var(--ai);padding:22px 20px 40px;border-radius:0 0 30px 30px}
.hero h1{font:800 32px/1.1 var(--f),Inter,sans-serif;margin:16px 0 4px}
.hero p{margin:0;opacity:.85}
.hr{display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;font-weight:600;font-size:13px}
.gh{border:0;background:none;color:inherit;opacity:.85;text-decoration:underline}
.tabs{display:flex;gap:4px;margin:-22px 14px 0;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--sh);position:sticky;top:8px;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;border-radius:12px;color:var(--mut);font-weight:500}
.tabs .on{background:var(--ac);color:var(--ai)}
.pills{display:flex;gap:8px;padding:16px 14px 6px;overflow-x:auto}
.pills button{white-space:nowrap;border:0;background:var(--card);box-shadow:var(--sh);border-radius:99px;padding:8px 16px}
.pills .on{background:var(--tx);color:var(--bg)}
.it{display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 28px);margin:10px 14px 0;padding:12px;background:var(--card);border:0;border-radius:20px;box-shadow:var(--sh)}
.em{flex:none;width:80px;height:80px;border-radius:16px;background:color-mix(in srgb,var(--ac) 14%,var(--card));display:grid;place-items:center;font-size:40px}
.tx{flex:1;min-width:0}.tx h3{margin:0;font-size:16px}.tx p{margin:2px 0 6px;color:var(--mut);font-size:13px}
.plus{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--ai);display:grid;place-items:center;font-size:22px}
.cb{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none}
.cb button{pointer-events:auto;display:flex;justify-content:space-between;width:100%;max-width:452px;margin:0 auto;border:0;border-radius:99px;padding:16px 22px;background:var(--ac);color:var(--ai);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.btn{display:flex;justify-content:center;width:100%;border:0;background:var(--ac);color:var(--ai);border-radius:16px;padding:15px;font-weight:600;margin-top:14px}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--ln);width:auto;margin:0;padding:10px 16px}
.sec{margin:14px}.sec h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border-radius:20px;padding:6px 16px;box-shadow:var(--sh)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.ln:last-child{border:0}
.st{display:flex;align-items:center;gap:10px}.st button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--bg)}
.tot{padding:12px 16px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-weight:700;font-size:18px;padding-top:8px}
.pay{display:flex;gap:8px;flex-wrap:wrap}.pay button{flex:1;min-width:110px;border:2px solid transparent;background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:12px}
.pay .on{border-color:var(--ac);font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;font-family:var(--f),Inter,sans-serif}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.ch button{border:2px solid transparent;background:var(--bg);border-radius:12px;padding:8px 14px}
.ch .on{border-color:var(--ac);font-weight:600}
.prog{display:flex;gap:4px;margin:12px 0 8px}.prog i{flex:1;height:8px;border-radius:4px;background:var(--ln)}.prog i.on{background:var(--ac)}
.oc{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:16px}
.col h2{font-size:14px;margin:0 0 10px;color:var(--mut)}
.tk{background:var(--card);border-radius:16px;border-left:6px solid var(--ac);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.tk ul{margin:8px 0;padding-left:18px}.tk .btn{margin-top:8px;padding:10px}
.rc{background:var(--card);border-radius:22px;margin:0 14px 14px;overflow:hidden;box-shadow:var(--sh)}
.rh{padding:16px;background:var(--ac);color:var(--ai);font-family:var(--f),Inter,sans-serif}.rh b{font-size:21px}
.tb{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.tb button{border:0;background:var(--bg);border-radius:12px;padding:9px 14px;font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 16px}
.row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.row input{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.row label:first-child{flex:1;min-width:230px}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.qc{background:#fff;color:#14151a;border-radius:20px;overflow:hidden;text-align:center;padding-bottom:12px;box-shadow:var(--sh);break-inside:avoid;font-family:var(--f),Inter,sans-serif}
.qh{background:var(--ac);color:var(--ai);padding:12px;font-weight:700;font-size:18px}
.qq{display:flex;justify-content:center;padding:16px 0 8px;word-break:break-all;font-size:11px}
.qc b{display:block;font-size:22px}.qc small{display:block;color:#666;margin:2px 10px 4px}.qc a{font-size:12px;color:#666}
@media print{.top,.nopr{display:none!important}body{background:#fff}.k{padding:0}.qg{grid-template-columns:repeat(3,1fr);gap:10mm}.qc{box-shadow:none;border:1px solid #ccc}.qc a{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
</style>
</head>
<body>

<script>
const R=[
{id:'esq',name:'La Esquina',tag:'Street tacos & bowls',ac:'#d8431f',ai:'#fff',f:"'Bricolage Grotesque'",cats:['Tacos','Bowls','Drinks'],items:[
{id:'e1',c:0,n:'Al pastor taco',d:'Pork, pineapple, onion, cilantro.',p:3.5,e:'🌮',o:[{k:'Tortilla',c:[['Corn',0],['Flour',0]]},{k:'Heat',c:[['Mild',0],['Hot',0]]}]},

{id:'m1',c:0,n:'Butter croissant',d:'Laminated 3 days, baked at dawn.',p:3.75,e:'🥐',o:[{k:'Warm',c:[['Yes',0],['No',0]]}]},
{id:'m2',c:0,n:'Guava pastelito',d:'Flaky pastry, guava, cream cheese.',p:3.25,e:'🥧',o:[]},
{id:'m3',c:0,n:'Sourdough toast',d:'Whipped ricotta, honey, sea salt.',p:6.5,e:'🍞',o:[{k:'Add',c:[['None',0],['Fried egg',2]]}]},
{id:'m4',c:1,n:'Flat white',d:'Double ristretto, steamed milk.',p:4,e:'☕',o:[{k:'Milk',c:[['Whole',0],['Oat',0.6],['Almond',0.6]]}]},
{id:'m5',c:1,n:'Iced latte',d:'Espresso over cold milk.',p:4.5,e:'🧋',o:[{k:'Milk',c:[['Whole',0],['Oat',0.6],['Almond',0.6]]}]}]}
];
// ===== BACKEND SETTINGS: paste your Supabase values between the quotes =====
const SUPABASE_URL='https://uhyxcqtfsjxkvxnqwdpv.supabase.co',SUPABASE_KEY='sb_publishable_R9Rq9_NkTRJUs3lJ43vQIw_y9aGdC1w';
// ==========================================================================
let DB=null,NET='';try{if(SUPABASE_URL&&SUPABASE_KEY&&window.supabase)DB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){NET=String(e)}
const norm=d=>({id:d.id,rid:d.rid,t:d.t,lines:d.lines,total:+d.total,pay:d.pay,st:d.st,at:new Date(d.created_at)});
const ST=['Received','Preparing','Ready','Served'];
const MSG=['Sent to the kitchen','Being prepared','On its way to your table','Enjoy your meal'];
let S={m:'c',rid:null,t:null,cat:0,cart:[],v:'menu',mod:null,sel:[],q:1,pay:'Card',orders:[],seq:41,kid:'esq',deep:false,qr:'esq',qn:8,url:''};
const $=i=>document.getElementById(i),$$=n=>'$'+n.toFixed(2),rest=id=>R.find(r=>r.id===id);
const base=()=>S.url||(/^https?:/.test(location.href)?location.href.split('#')[0]:'');
function brand(r){const a=$('app');a.style.setProperty('--ac',r?r.ac:'#14151a');a.style.setProperty('--ai',r?r.ai:'#fff');a.style.setProperty('--f',r?r.f:'Inter')}
function route(){const h=location.hash.slice(1);let m;S.deep=false;
 if(m=/^kitchen-([a-z]+)$/.exec(h)){if(rest(m[1])){S.m='k';S.kid=m[1];S.deep=true}}
 else if(m=/^([a-z]+)-(\d+)$/.exec(h)){if(rest(m[1])){S.m='c';if(S.rid!==m[1]||S.t!==+m[2]){S.cart=[];S.cat=0;S.v='menu'}S.rid=m[1];S.t=+m[2];S.deep=true}}}
const setM=m=>{S.m=m;render()};
const scan=(r,t)=>{S.rid=r;S.t=t;S.cat=0;S.cart=[];S.v='menu';render()};
const leave=()=>{S.rid=null;S.cart=[];render()};
const go=v=>{S.v=v;render();scrollTo(0,0);if(v==='track')load(true)};
function openItem(id){const it=rest(S.rid).items.find(i=>i.id===id);S.mod=it;S.sel=it.o.map(()=>0);S.q=1;render()}
const pick=(g,i)=>{S.sel[g]=i;render()};
const qty=d=>{S.q=Math.max(1,S.q+d);render()};
const unit=(it,sel)=>it.p+it.o.reduce((a,o,g)=>a+o.c[sel[g]][1],0);
function add(){const it=S.mod,lab=it.o.map((o,g)=>o.c[S.sel[g]][0]).join(', ');const ex=S.cart.find(l=>l.it.id===it.id&&l.lab===lab);
 if(ex)ex.q+=S.q;else S.cart.push({it,lab,u:unit(it,S.sel),q:S.q});S.mod=null;render()}
function cq(i,d){S.cart[i].q+=d;if(S.cart[i].q<1)S.cart.splice(i,1);if(!S.cart.length)S.v='menu';render()}
const sub=()=>S.cart.reduce((a,l)=>a+l.u*l.q,0),cnt=()=>S.cart.reduce((a,l)=>a+l.q,0);
const setPay=p=>{S.pay=p;render()};
async function place(){
 if(S.busy)return;const o={rid:S.rid,t:S.t,lines:S.cart.map(l=>({n:l.it.n,lab:l.lab,q:l.q})),total:+(sub()*1.07).toFixed(2),pay:S.pay};
 if(DB){S.busy=1;const {data,error}=await DB.from('orders').insert(o).select().single();S.busy=0;
  if(error){alert('Your order could not be sent. Please try again or ask a waiter.\n'+error.message);return}
  S.orders.push(norm(data))}
 else S.orders.push({id:S.seq++,...o,st:0,at:new Date()});
 S.cart=[];S.v='track';render();scrollTo(0,0)}
async function load(force){
 if(!DB)return;let q=DB.from('orders').select('*').order('id');
 if(S.m==='k')q=q.eq('rid',S.kid).gte('created_at',new Date(Date.now()-12*36e5).toISOString());
 else if(S.m==='c'&&S.rid)q=q.eq('rid',S.rid).eq('t',S.t).gte('created_at',new Date(Date.now()-3*36e5).toISOString());
 else return;
 const {data,error}=await q;
 if(error){NET=error.message;if(force)render();return}
 NET='';const n=data.map(norm),sig=JSON.stringify(n);
 if(sig===S.sig&&!force)return;S.sig=sig;S.orders=n;
 if(!S.mod&&(force||S.m==='k'||S.v==='track'))render()}
function live(){if(!DB)return;
 DB.channel('orders-feed').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>load()).subscribe();
 setInterval(()=>{if(!document.hidden)load()},4000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()})}
async function adv(id){const o=S.orders.find(x=>x.id===id);if(!o||o.st>2)return;
 if(DB){const {error}=await DB.from('orders').update({st:o.st+1}).eq('id',id).eq('st',o.st);if(error)NET=error.message;await load(true);return}
 o.st++;render()}
const setK=id=>{S.kid=id;render();load(true)};
function render(){
 $('top').hidden=S.deep;
 $('seg').innerHTML=[['c','Guest demo'],['k','Kitchen'],['q','QR codes']].map(([m,l])=>`<button class="${S.m===m?'on':''}" onclick="setM('${m}')">${l}</button>`).join('');
 if(S.m==='q'){brand(null);$('app').innerHTML=qrpage();qgrid();return}
 if(S.m==='k'){brand(rest(S.kid));$('app').innerHTML=kitchen();return}
 const r=S.rid?rest(S.rid):null;brand(r);$('app').innerHTML=r?guest(r):home()}
function home(){return `<div class="w"><div class="k" style="padding-bottom:6px"><h1 class="h1">Try it as a guest</h1><p class="mut" style="margin:0">Tap a table to act like you just scanned its code. Real QR codes are in the QR codes tab.</p></div>`+
 R.map(r=>`<div class="rc"><div class="rh" style="--ac:${r.ac};--f:${r.f}"><b>${r.name}</b><div style="opacity:.85;font-size:13px">${r.tag}</div></div><div class="tb">${[1,2,3,4].map(t=>`<button onclick="scan('${r.id}',${t})">Table ${t}</button>`).join('')}</div></div>`).join('')+'</div>'}
function guest(r){
 let h=`<div class="w"><div class="hero"><div class="hr"><span class="pill">Table ${S.t}</span>${S.deep?'':'<button class="gh" onclick="leave()">Leave table</button>'}</div><h1>${r.name}</h1><p>${r.tag}</p></div>
 <div class="tabs">${[['menu','Menu'],['cart','Cart'+(cnt()?' ('+cnt()+')':'')],['track','Orders']].map(t=>`<button class="${S.v===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
 if(S.v==='menu'){
  h+=`<div class="pills">${r.cats.map((c,i)=>`<button class="${S.cat===i?'on':''}" onclick="S.cat=${i};render()">${c}</button>`).join('')}</div>`;
  h+=r.items.filter(i=>i.c===S.cat).map(i=>`<button class="it" onclick="openItem('${i.id}')"><span class="em">${i.e}</span><span class="tx"><h3>${i.n}</h3><p>${i.d}</p><b>${$$(i.p)}</b></span><span class="plus">+</span></button>`).join('');
  if(cnt())h+=`<div class="cb"><button onclick="go('cart')"><span>View cart · ${cnt()}</span><span>${$$(sub())}</span></button></div>`}
 if(S.v==='cart'){
  if(!S.cart.length)h+=`<div class="sec mut" style="margin-top:22px">Your cart is empty. Pick something from the menu.</div><div class="sec"><button class="btn" onclick="go('menu')">Browse menu</button></div>`;
  else{const s=sub();
   h+=`<div class="sec"><div class="card">${S.cart.map((l,i)=>`<div class="ln"><div><b>${l.it.n}</b><div class="mut" style="font-size:13px">${l.lab}</div></div><div style="text-align:right"><div class="st"><button onclick="cq(${i},-1)" aria-label="Remove one">−</button>${l.q}<button onclick="cq(${i},1)" aria-label="Add one">+</button></div><div>${$$(l.u*l.q)}</div></div></div>`).join('')}</div></div>
   <div class="sec card tot"><div><span class="mut">Subtotal</span><span>${$$(s)}</span></div><div><span class="mut">Tax (7%)</span><span>${$$(s*.07)}</span></div><div class="g"><span>Total</span><span>${$$(s*1.07)}</span></div></div>
   <div class="sec"><h2>Pay with</h2><div class="pay">${['Card','Phone wallet','Cash at table'].map(p=>`<button class="${S.pay===p?'on':''}" onclick="setPay('${p}')">${p}</button>`).join('')}</div><button class="btn" onclick="place()">Place order · Table ${S.t}</button></div>`}}
 if(S.v==='track'){
  const os=S.orders.filter(o=>o.rid===r.id&&o.t===S.t).reverse();
  h+=`<div class="sec" style="margin-top:22px">${os.length?'':'<span class="mut">No orders yet. Once you place one, you’ll see its progress here.</span>'}`+
  os.map(o=>`<div class="oc"><div style="display:flex;justify-content:space-between"><b>Order #${o.id}</b><span>${$$(o.total)}</span></div><div class="prog">${ST.map((_,i)=>`<i class="${i<=o.st?'on':''}"></i>`).join('')}</div><div><b>${ST[o.st]}</b> <span class="mut">· ${MSG[o.st]}</span></div><div class="mut" style="font-size:13px;margin-top:8px">${o.lines.map(l=>l.q+'× '+l.n).join(', ')}</div></div>`).join('')+'</div>'}
 if(S.mod){const it=S.mod;h+=`<div class="mo" onclick="if(event.target===this){S.mod=null;render()}"><div class="sh"><div style="display:flex;gap:14px;align-items:center"><span class="em">${it.e}</span><div><h3 style="margin:0;font-size:19px">${it.n}</h3><div class="mut" style="font-size:13px">${it.d}</div></div></div><div style="margin-top:16px">${it.o.map((o,g)=>`<b>${o.k}</b><div class="ch">${o.c.map((c,i)=>`<button class="${S.sel[g]===i?'on':''}" onclick="pick(${g},${i})">${c[0]}${c[1]?' +'+$$(c[1]):''}</button>`).join('')}</div>`).join('')}
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="st"><button onclick="qty(-1)" aria-label="Fewer">−</button>${S.q}<button onclick="qty(1)" aria-label="More">+</button></div><span class="mut">${$$(unit(it,S.sel))} each</span></div><button class="btn" onclick="add()">Add to cart · ${$$(unit(it,S.sel)*S.q)}</button></div></div></div>`}
 return h+'</div>'}
function kitchen(){
 const r=rest(S.kid),os=S.orders.filter(o=>o.rid===S.kid);
 let h=`<div class="k">${S.deep?'':`<div class="pills" style="padding:0 0 14px">${R.map(x=>`<button class="${x.id===S.kid?'on':''}" onclick="setK('${x.id}')">${x.name}</button>`).join('')}</div>`}<h1 class="h1" style="font-family:var(--f),Inter">${r.name} · live orders</h1><div class="mut">${DB?(NET?`<span style="color:#d33">Connection problem: ${NET.replace(/</g,'&lt;')}</span>`:'● Live. New orders appear the moment a guest places them.'):'Demo mode: orders stay on this device. Add your Supabase keys to go live.'}</div>`;
 if(!os.length)h+=`<div class="oc" style="margin-top:16px">No orders yet. Place one from Guest demo to see it here.</div>`;
 h+=`<div class="cols">${[0,1,2].map(s=>{const l=os.filter(o=>o.st===s);return `<div class="col"><h2>${['New','Preparing','Ready to serve'][s]} (${l.length})</h2>${l.map(o=>`<div class="tk"><div style="display:flex;justify-content:space-between"><b>#${o.id} · Table ${o.t}</b><span class="mut">${o.at.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><ul>${o.lines.map(x=>`<li><b>${x.q}×</b> ${x.n}${x.lab?`<div class="mut" style="font-size:12px">${x.lab}</div>`:''}</li>`).join('')}</ul><div class="mut" style="font-size:12px">Payment: ${o.pay}</div><button class="btn" onclick="adv(${o.id})">${['Start preparing','Mark ready','Mark served'][s]}</button></div>`).join('')}</div>`}).join('')}</div>`;
 const d=os.filter(o=>o.st===3).length;if(d)h+=`<p class="mut">${d} order${d>1?'s':''} served.</p>`;
 return h+'</div>'}
function qrpage(){const r=rest(S.qr);
 return `<div class="k"><h1 class="nopr h1">Table QR codes</h1><p class="nopr mut">Print one for each table. A guest scans it with the phone camera and lands directly on that restaurant’s menu with the table already set.</p>
 <div class="pills nopr" style="padding:0 0 14px">${R.map(x=>`<button class="${x.id===S.qr?'on':''}" onclick="S.qr='${x.id}';render()">${x.name}</button>`).join('')}</div>
 <div class="row nopr"><label>Website address (paste your live link)<input id="ui" value="${base()}" placeholder="https://your-site.vercel.app/" oninput="S.url=this.value.trim();qgrid()"></label><label>Tables<input type="number" min="1" max="60" value="${S.qn}" style="width:90px" oninput="S.qn=Math.min(60,Math.max(1,+this.value||1));qgrid()"></label><button class="btn s" onclick="print()">Print codes</button></div>
 <div id="qg" class="qg"></div></div>`}
function qgrid(){const r=rest(S.qr),b=base();let h='';
 if(!b){$('qg').innerHTML='<p class="mut">Enter your website address above to generate the codes.</p>';return}
 for(let t=1;t<=S.qn;t++){const u=`${b}#${r.id}-${t}`;h+=`<div class="qc" style="--ac:${r.ac};--ai:${r.ai};--f:${r.f}"><div class="qh">${r.name}</div><div class="qq" data-u="${u}"></div><b>Table ${t}</b><small>Scan to see the menu and order</small><a href="${u}" target="_blank" rel="noopener">Test link</a></div>`}
 $('qg').innerHTML=h;document.querySelectorAll('.qq').forEach(e=>{if(window.QRCode)new QRCode(e,{text:e.dataset.u,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});else e.textContent=e.dataset.u})}
addEventListener('hashchange',()=>{route();render();load(true)});
route();render();live();load(true);
</script>
</body>
